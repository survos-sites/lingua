; Dev-server settings for this project only (the Symfony CLI merges a project php.ini).
;
; ffi.enable: PHP ships with "preload", which lets FFI be used from the command line but not from a web request.
; The translate page (/translate) calls the native EuroNano engine through FFI inside the request, so it needs it on.
; Production (FrankenPHP, docker/php.ini) is not affected by this file.
ffi.enable = 1
