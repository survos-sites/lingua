; Runtime overrides for the FrankenPHP image. FrankenPHP embeds PHP directly (not
; php-fpm/php-cgi), so the buildpack-era fpm_custom.conf and .user.ini are not
; picked up -- these go in conf.d instead.

memory_limit=512M
upload_max_filesize=32M
post_max_size=32M

; Translation of a large payload can take minutes. The ash nginx snippet for babel
; used proxy_read_timeout 300s and called it load-bearing -- the default 60s
; truncates bulk jobs. lingua is the caller, so it needs headroom on its own side.
max_execution_time=300

; Long-lived process: the opcache stays warm across requests instead of being
; rebuilt per request as under php-fpm. This is the reason for the migration.
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
