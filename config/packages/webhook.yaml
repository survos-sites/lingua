framework:
    # lingua is a webhook SENDER only — it tells subscribers when their strings finished
    # translating (App\Service\TranslationNotifier). It receives none, so there is no `routing:`
    # block and config/routes/ does not import FrameworkBundle's /webhook/{name} controller.
    #
    # Use Symfony's defaults: Webhook-Event, Webhook-Id, Webhook-Signature and sha256.
    # These explicit configuration keys do not exist on Symfony 7.4.
    # Receivers verify the same defaults; see docs/webhooks.md.
    webhook:
        enabled: true
