framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
#             async: '%env(MESSENGER_TRANSPORT_DSN)%'
             failed: 'doctrine://default?queue_name=failed'
             sync: 'sync://'
             async:
               dsn: '%env(MESSENGER_TRANSPORT_DSN)%'

        routing:
            # Route your messages to the transports
#             'Survos\StateBundle\Message\TransitionMessage': async


# NOTE: overriding `async` here would do nothing for the translate path. state-bundle
# auto-registers a per-transition transport -- `target.translate`, dsn doctrine://default --
# and AsyncQueueLocator::stamps() routes TransitionMessage there, overriding any transport
# stamp built from the request payload. In the test env doctrine://default is lingua_test, so
# dispatched jobs land in its messenger_messages table with auto_setup creating it; that is
# what TranslateBatchMethodTest counts.
#
# when@test:
#    framework:
#        messenger:
#            transports:
#                async: 'in-memory://'
