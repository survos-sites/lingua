framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
#             async: '%env(MESSENGER_TRANSPORT_DSN)%'
             # STAYS on Doctrine on purpose. A failed message is one you want to look at and
             # retry, and under AMQP it is invisible to both `messenger:failed:show` tooling
             # backed by the table and to zenstruck/messenger-monitor. Same choice packages
             # made.
             failed: 'doctrine://default?queue_name=failed'
             sync: 'sync://'
             async:
               dsn: '%env(MESSENGER_TRANSPORT_DSN_RABBITMQ)%/async'

             # NOTE: moving target.translate to AMQP orphans the ~62k TransitionMessages the
             # 2026-08-17 push left in Postgres — the worker now reads an AMQP queue that
             # starts empty. That is deliberate and cheap: those are one-string-per-message
             # jobs, and re-pushing the same datasets regenerates them as batched
             # TranslateBatchMessages (~100 targets per message), which is both faster and
             # what we want in the queue anyway. Purge the dead rows rather than draining them:
             #   DELETE FROM messenger_messages WHERE queue_name = 'target.translate';
             # Also stays on Doctrine: low volume (one message per page of 500 translations),
             # and being able to see a stuck delivery as a row is worth more here than the
             # throughput AMQP would add.
             # Outbound translation.completed delivery, plus the flush that produces it.
             # Its own transport because it is the only work here that depends on someone
             # else's uptime, so it is the only queue that will sit in retry — and a
             # subscriber being down must not stop `target.translate` from draining.
             webhook:
               dsn: 'doctrine://default?queue_name=webhook'
               retry_strategy:
                   # A subscriber restarting during a deploy is the expected failure; give it
                   # minutes. 4xx never reaches retry — VerifyingWebhookTransport raises those
                   # as unrecoverable so they go straight to `failed`.
                   max_retries: 5
                   delay: 5000
                   multiplier: 4
                   max_delay: 3600000

        routing:
            # Route your messages to the transports
#             'Survos\StateBundle\Message\TransitionMessage': async
            # The coalescing drain. Shares the webhook transport with the deliveries it
            # produces so that "pause announcements" is one `messenger:stop-workers`-scoped
            # decision rather than two.
            'App\Message\FlushTranslationNotificationsMessage': webhook
            'Symfony\Component\Webhook\Messenger\SendWebhookMessage': webhook
            # Batched translation. Shares target.translate with the per-Target
            # TransitionMessage path so ONE worker drains both — which matters right now,
            # because ~62k TransitionMessages from the 2026-08-17 push are still in that
            # queue and will keep arriving one string at a time until they clear.
            #
            # state-bundle auto-registers target.translate (doctrine://default) from the
            # `async: true` on TRANSITION_TRANSLATE; naming it here just routes the new
            # message to the same place.
            'App\Message\TranslateBatchMessage': target.translate


# NOTE: overriding `async` here would do nothing for the translate path. state-bundle
# auto-registers a per-transition transport -- `target.translate`, dsn doctrine://default --
# and AsyncQueueLocator::stamps() routes TransitionMessage there, overriding any transport
# stamp built from the request payload. In the test env doctrine://default is lingua_test, so
# dispatched jobs land in its messenger_messages table with auto_setup creating it; that is
# what TranslateBatchMethodTest counts.
#
# when@test:
#    framework:
#        messenger:
#            transports:
#                async: 'in-memory://'
