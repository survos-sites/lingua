framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
#             async: '%env(MESSENGER_TRANSPORT_DSN)%'
             # STAYS on Doctrine on purpose. A failed message is one you want to look at and
             # retry, and under AMQP it is invisible to both `messenger:failed:show` tooling
             # backed by the table and to zenstruck/messenger-monitor. Same choice packages
             # made.
             failed: 'doctrine://default?queue_name=failed'
             sync: 'sync://'
             async:
               dsn: '%env(MESSENGER_TRANSPORT_DSN_RABBITMQ)%/async'
               options:
                 delay:
                   # No retry_strategy is set on this transport, which does NOT mean no
                   # retries -- Symfony's default is max_retries: 3, so the first failure
                   # here declares a delay queue. Without `durable: true`
                   # jwage/phpamqplib-messenger declares it transient + non-exclusive, which
                   # RabbitMQ 4.3 denies by default (`transient_nonexcl_queues`): the broker
                   # answers INTERNAL_ERROR and CLOSES the connection, and because that
                   # happens inside SendFailedMessageForRetryListener the worker EXITS rather
                   # than retrying. One source 5xx then kills the worker for good. Opt-in flag
                   # from jwage/phpamqplib-messenger#124 (merged 2026-08-25, untagged -- see
                   # the dev-main constraint in composer.json).
                   durable: true

             # NOTE: moving target.translate to AMQP orphans the ~62k TransitionMessages the
             # 2026-08-17 push left in Postgres — the worker now reads an AMQP queue that
             # starts empty. That is deliberate and cheap: those are one-string-per-message
             # jobs, and re-pushing the same datasets regenerates them as batched
             # TranslateBatchMessages (~100 targets per message), which is both faster and
             # what we want in the queue anyway. Purge the dead rows rather than draining them:
             #   DELETE FROM messenger_messages WHERE queue_name = 'target.translate';
             # Also stays on Doctrine: low volume (one message per page of 500 translations),
             # and being able to see a stuck delivery as a row is worth more here than the
             # throughput AMQP would add.
             # Keep notification scans separate from outbound HTTP delivery.
             translation_notifications:
               dsn: 'doctrine://default?queue_name=translation_notifications'
             # Outbound translation.completed delivery.
             # Its own transport because it is the only work here that depends on someone
             # else's uptime, so it is the only queue that will sit in retry — and a
             # subscriber being down must not stop `target.translate` from draining.
             webhook:
               dsn: 'doctrine://default?queue_name=webhook'
               retry_strategy:
                   # A subscriber restarting during a deploy is the expected failure; give it
                   # minutes. 4xx never reaches retry — VerifyingWebhookTransport raises those
                   # as unrecoverable so they go straight to `failed`.
                   max_retries: 5
                   delay: 5000
                   multiplier: 4
                   max_delay: 3600000

        routing:
            # Route your messages to the transports
#             'Survos\StateBundle\Message\TransitionMessage': async
            'App\Message\FlushTranslationNotificationsMessage': translation_notifications
            'Symfony\Component\Webhook\Messenger\SendWebhookMessage': webhook
            # Batched translation. Shares target.translate with the per-Target
            # TransitionMessage path so ONE worker drains both — which matters right now,
            # because ~62k TransitionMessages from the 2026-08-17 push are still in that
            # queue and will keep arriving one string at a time until they clear.
            #
            # state-bundle auto-registers target.translate (doctrine://default) from the
            # `async: true` on TRANSITION_TRANSLATE; naming it here just routes the new
            # message to the same place.
            'App\Message\TranslateBatchMessage': target.translate


# NOTE: overriding `async` here would do nothing for the translate path. state-bundle
# auto-registers a per-transition transport -- `target.translate`, dsn doctrine://default --
# and AsyncQueueLocator::stamps() routes TransitionMessage there, overriding any transport
# stamp built from the request payload. In the test env doctrine://default is lingua_test, so
# dispatched jobs land in its messenger_messages table with auto_setup creating it; that is
# what TranslateBatchMethodTest counts.
#
# when@test:
#    framework:
#        messenger:
#            transports:
#                async: 'in-memory://'

# --- Native translation worker (dev/test only; see doc/TRANSLATION_WORKER.md) ---
# Worker profiles (dispatch: worker in services.yaml) are dev-only, so these transports and
# their routing are too: production config is untouched. Wire shapes are the DTOs in
# src/Message/TranslationWorker; Python models are generated from them.
when@dev:
    framework:
        messenger:
            transports:
                # Transactional outbox: same `default` connection as the TranslationJob rows.
                translation_outbox:
                    dsn: 'doctrine://default?queue_name=translation_outbox'
                    retry_strategy:
                        max_retries: 5
                        delay: 2000
                        multiplier: 3
                        max_delay: 300000
                # Send-only: plain-JSON TranslationJobRequest, published mandatory + confirmed to the
                # profile's routingKey. Broker credentials come from TRANSLATION_WORKER_AMQP_DSN.
                translation_jobs: 'translation-jobs://'
                # Plain-JSON results from the FastStream worker. Lingua owns this queue, its
                # binding, and the exchange; the worker owns its job queues and DLQs.
                # max_retries 0: a result that cannot be applied goes straight to Doctrine
                # `failed`, rather than through an AMQP delay queue that would need re-encoding.
                translation_results:
                    dsn: '%env(TRANSLATION_WORKER_AMQP_DSN)%'
                    serializer: App\Messenger\TranslationResultJsonSerializer
                    retry_strategy:
                        max_retries: 0
                    options:
                        prefetch_count: 1
                        # Retries are 0, so no delay exchange/queues; the dev broker user may
                        # only configure ai.translation.* / lingua.translation.* anyway.
                        delay:
                            enabled: false
                        exchange:
                            name: '%translation.worker_exchange%'
                            type: direct
                            durable: true
                        queues:
                            lingua.translation.results.v1:
                                durable: true
                                bindings:
                                    - { routing_key: 'lingua.results' }
            routing:
                'App\Message\TranslationWorker\PublishTranslationJobMessage': translation_outbox
                'App\Message\TranslationWorker\TranslationJobRequest': translation_jobs

when@test:
    framework:
        messenger:
            transports:
                translation_outbox: 'in-memory://'
                translation_jobs: 'translation-jobs://'
                translation_results: 'in-memory://'
            routing:
                'App\Message\TranslationWorker\PublishTranslationJobMessage': translation_outbox
                'App\Message\TranslationWorker\TranslationJobRequest': translation_jobs
