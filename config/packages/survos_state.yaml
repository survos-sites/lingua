survos_state:
    # RabbitMQ for the per-transition transports state-bundle registers itself (target.translate
    # is the one that matters here). Same arrangement as `packages`, via
    # jwage/phpamqplib-messenger's dsn/vhost/exchange convention: one queue per async
    # transition, instead of Doctrine's shared table filtered by queue_name.
    #
    # Why move: target.translate is the only high-volume queue in this app, and on Doctrine it
    # lives in the SAME Postgres that serves the application. The 2026-08-17 push put ~62k rows
    # in it, every worker polls it with SELECT ... FOR UPDATE SKIP LOCKED, and that cluster has
    # been refusing connections from one-off containers ("SQLSTATE[08006] ... timeout expired",
    # observed repeatedly on 2026-08-17/18) while app containers stayed fine. Taking the
    # messenger load off it is the point.
    queue_driver: rabbitmq
    async_transport_dsn: '%env(MESSENGER_TRANSPORT_DSN_RABBITMQ)%'

# DEV NOW RUNS ON RABBIT TOO — the same reasoning as running Postgres rather than SQLite
# locally: the broker is what production uses, so it is what dev should exercise. A dev/prod
# split here is exactly how a broker-only bug reaches production unnoticed, and the Doctrine
# fallback is the thing you opt INTO for a debugging session, not the default. There is a
# RabbitMQ running locally (survos_rabbitmq, rabbitmq:4-management).
#
# What you give up locally: under RabbitMQ these messages are invisible to
# `messenger_messages` and to zenstruck/messenger-monitor — which is precisely how a working
# kickoff came to look like a broken one in packages on 2026-08-17 (a flat count of
# messenger_messages rows was read as "nothing dispatched"). The management UI on :15672
# covers queue depth; to get inspectable rows back, re-add:
#
#   when@dev:
#       survos_state:
#           queue_driver: doctrine
#           async_transport_dsn: '%env(DOCTRINE_MESSENGER_TRANSPORT_DSN)%'
#
# `when@test` below stays on Doctrine and is load-bearing, not inertia: TranslateBatchMethodTest
# asserts on row counts in messenger_messages, and CI has no broker. Switching test to AMQP
# would make those assertions count zero forever while the code underneath still worked.
#
# queue_driver is set per-env rather than by env var because it is an EnumNode — a '%env(...)%'
# placeholder fails validation before it can be resolved ("The value "" is not allowed ...
# Permissible values: doctrine, rabbitmq"). async_transport_dsn IS env-driven, because that one
# is passed through as an opaque DSN string and resolved later.
when@test:
    survos_state:
        queue_driver: doctrine
        async_transport_dsn: '%env(DOCTRINE_MESSENGER_TRANSPORT_DSN)%'
