# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # --- Outbound webhook delivery (see docs/webhooks.md) ---

    # http_client, but routing `.wip` subscribers through the Symfony CLI proxy. Local
    # subscribers (zm.wip, openfoto.wip …) resolve nowhere else, so without this the whole
    # local end-to-end path fails silently. No $baseUri: one client posts to many different
    # subscribers, so the decision is per request URL.
    survos.webhook.http_client:
        class: Survos\FetchBundle\Http\WipProxyHttpClient
        arguments:
            $client: '@http_client'

    # Symfony's webhook.transport discards the response, so a failed delivery is
    # indistinguishable from a successful one and Messenger never retries. This one reads the
    # status code and lets the retry policy do its job.
    Survos\Kit\Webhook\VerifyingWebhookTransport:
        decorates: 'webhook.transport'
        arguments:
            $client: '@survos.webhook.http_client'
            $headers: '@webhook.headers_configurator'
            $body: '@webhook.body_configurator.json'
            $signer: '@webhook.signer'
            $logger: '@logger'
